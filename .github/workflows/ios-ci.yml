name: iOS CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
    # 纯文档/工具脚本改动不触发构建：省 macOS 额度，也避免"排队抢占失败"刷出一堆无产物运行
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免多个运行互相抢 macOS runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30
    # 构建失败的 error 行会以 annotation 形式贴在运行页面，无需登录即可看到
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "15.4"
    
    - name: Cache SPM Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Prepare Build Paths
      run: |
        # 版本号：tag 构建取 tag 名（v1.1.2 -> 1.1.2），普通 push 取工程里的 MARKETING_VERSION
        VERSION="${GITHUB_REF_NAME#v}"
        if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ -z "$VERSION" ]; then
          VERSION=$(grep -m1 'MARKETING_VERSION' Legado.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = //; s/;//' | tr -d ' \t')
        fi
        echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
        echo "DERIVED_DATA=$RUNNER_TEMP/LegadoDerivedData" >> "$GITHUB_ENV"
        echo "RESULT_BUNDLE=$RUNNER_TEMP/LegadoResults-$VERSION.xcresult" >> "$GITHUB_ENV"
        echo "构建版本：$VERSION build ${GITHUB_RUN_NUMBER}"
    
    - name: Resolve SPM Dependencies
      run: >
        xcodebuild -resolvePackageDependencies
        -project Legado.xcodeproj
        -scheme Legado
    
    - name: Build
      run: |
        set -o pipefail
        xcodebuild build \
          -project Legado.xcodeproj \
          -scheme Legado \
          -sdk iphoneos \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath "$DERIVED_DATA" \
          -resultBundlePath "$RESULT_BUNDLE" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          MARKETING_VERSION="$APP_VERSION" \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
          IPHONEOS_DEPLOYMENT_TARGET=16.0 2>&1 | tee build.log

    # 把编译错误作为 annotation 打出来：不登录 GitHub 也能在运行页面直接看到
    - name: Show compile errors
      if: failure()
      continue-on-error: true
      run: |
        if [ -f build.log ]; then
          grep -E "error:" build.log | head -n 12 | sed 's/^/::error::/' || true
          echo "----- full error list -----" || true
          grep -E "error:" build.log | head -n 80 || true
        fi

    - name: Check Unit Test Target
      id: test_target
      run: |
        if grep -q "com.apple.product-type.bundle.unit-test" Legado.xcodeproj/project.pbxproj; then
          echo "has_tests=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_tests=false" >> "$GITHUB_OUTPUT"
        fi
    
    - name: Run Unit Tests
      if: ${{ success() && steps.test_target.outputs.has_tests == 'true' }}
      run: >
        xcodebuild test
        -project Legado.xcodeproj
        -scheme Legado
        -sdk iphonesimulator
        -configuration Debug
        -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5'
        -derivedDataPath "$DERIVED_DATA"
        -resultBundlePath "$RESULT_BUNDLE"
        ONLY_ACTIVE_ARCH=YES
        IPHONEOS_DEPLOYMENT_TARGET=16.0

    - name: Package Unsigned IPA
      if: success()
      run: |
        APP_DIR="$DERIVED_DATA/Build/Products/Release-iphoneos/Legado.app"
        IPA_DIR="$RUNNER_TEMP/ipa"
        IPA_NAME="Legado-$APP_VERSION.ipa"

        rm -rf "$IPA_DIR"
        mkdir -p "$IPA_DIR/Payload"
        cp -R "$APP_DIR" "$IPA_DIR/Payload/"

        # IPA 内的版本号必须和本次 release 的版本一致
        PLIST="$IPA_DIR/Payload/Legado.app/Info.plist"
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" 2>/dev/null || true
        echo "IPA 内版本：$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" 2>/dev/null) ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST" 2>/dev/null))"

        (
          cd "$IPA_DIR"
          /usr/bin/zip -qry "$IPA_NAME" Payload
        )

        echo "IPA_PATH=$IPA_DIR/$IPA_NAME" >> "$GITHUB_ENV"
        echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

    - name: Job Summary
      if: success()
      run: |
        {
          echo "### 构建产物 v$APP_VERSION（build $BUILD_NUMBER）"
          echo ""
          echo "| Artifact | 文件 | 用途 |"
          echo "| --- | --- | --- |"
          echo "| \`Legado-iOS-IPA-$APP_VERSION\` | \`$IPA_NAME\` | 未签名 IPA，用 ESign / Feather / Sideloadly 自签安装 |"
          echo "| \`Legado-iOS-App-$APP_VERSION\` | \`Legado.app\` | 未签名 .app 目录 |"
          echo "| \`Legado-xcresult-$APP_VERSION\` | \`.xcresult\` | Xcode 构建结果包（调试用） |"
          echo ""
          echo "IPA 大小：$(du -h "$IPA_PATH" | cut -f1)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Xcode Result Bundle
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Legado-xcresult-${{ env.APP_VERSION }}
        path: ${{ env.RESULT_BUNDLE }}
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload Build Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Legado-iOS-App-${{ env.APP_VERSION }}
        path: ${{ env.DERIVED_DATA }}/Build/Products/Release-iphoneos/Legado.app
        retention-days: 14
        if-no-files-found: error

    - name: Upload IPA Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Legado-iOS-IPA-${{ env.APP_VERSION }}
        path: ${{ env.IPA_PATH }}
        retention-days: 14
        if-no-files-found: error

  release:
    name: Create Release
    needs: build-and-test
    # 只是下载产物 + 建 Release，用 ubuntu 更快也更省 macOS 额度
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download IPA Artifact
      uses: actions/download-artifact@v4
      with:
        # artifact 名带版本号（Legado-iOS-IPA-1.1.2），这里按前缀取
        pattern: Legado-iOS-IPA-*
        path: release/
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        # 产物文件名以版本号结尾：Legado-1.1.2.ipa
        files: release/*.ipa
        generate_release_notes: true
        draft: false
