name: iOS CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30
    # 构建失败时把 error: 行写到 ci-log 分支，方便不在 Mac 上也能看到编译错误
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "15.4"
    
    - name: Cache SPM Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Prepare Build Paths
      run: |
        echo "DERIVED_DATA=$RUNNER_TEMP/LegadoDerivedData" >> "$GITHUB_ENV"
        echo "RESULT_BUNDLE=$RUNNER_TEMP/LegadoResults.xcresult" >> "$GITHUB_ENV"
    
    - name: Resolve SPM Dependencies
      run: >
        xcodebuild -resolvePackageDependencies
        -project Legado.xcodeproj
        -scheme Legado
    
    - name: Build
      run: |
        set -o pipefail
        xcodebuild build \
          -project Legado.xcodeproj \
          -scheme Legado \
          -sdk iphoneos \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath "$DERIVED_DATA" \
          -resultBundlePath "$RESULT_BUNDLE" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          IPHONEOS_DEPLOYMENT_TARGET=16.0 2>&1 | tee build.log

    - name: Publish failure log
      if: failure()
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let log = '';
          try { log = fs.readFileSync('build.log', 'utf8'); } catch (error) {}
          const errors = log.split('\n').filter((line) => /error:/.test(line)).join('\n');
          const text = errors || log.slice(-20000) || '(没有抓到日志)';
          const branch = 'ci-log';
          const { owner, repo } = context.repo;
          try {
            await github.rest.git.createRef({
              owner, repo, ref: `refs/heads/${branch}`, sha: context.sha
            });
          } catch (error) {}
          let existingSha;
          try {
            const res = await github.rest.repos.getContent({
              owner, repo, path: 'build-error.log', ref: branch
            });
            existingSha = res.data.sha;
          } catch (error) {}
          const params = {
            owner, repo, branch, path: 'build-error.log',
            message: 'ci: 构建失败日志',
            content: Buffer.from(text).toString('base64')
          };
          if (existingSha) { params.sha = existingSha; }
          await github.rest.repos.createOrUpdateFileContents(params);

    - name: Check Unit Test Target
      id: test_target
      run: |
        if grep -q "com.apple.product-type.bundle.unit-test" Legado.xcodeproj/project.pbxproj; then
          echo "has_tests=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_tests=false" >> "$GITHUB_OUTPUT"
        fi
    
    - name: Run Unit Tests
      if: ${{ success() && steps.test_target.outputs.has_tests == 'true' }}
      run: >
        xcodebuild test
        -project Legado.xcodeproj
        -scheme Legado
        -sdk iphonesimulator
        -configuration Debug
        -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5'
        -derivedDataPath "$DERIVED_DATA"
        -resultBundlePath "$RESULT_BUNDLE"
        ONLY_ACTIVE_ARCH=YES
        IPHONEOS_DEPLOYMENT_TARGET=16.0

    - name: Package Unsigned IPA
      if: success()
      run: |
        IPA_DIR="$RUNNER_TEMP/ipa"
        rm -rf "$IPA_DIR"
        mkdir -p "$IPA_DIR/Payload"
        cp -R "$DERIVED_DATA/Build/Products/Release-iphoneos/Legado.app" "$IPA_DIR/Payload/"
        (
          cd "$IPA_DIR"
          /usr/bin/zip -qry "Legado-unsigned.ipa" Payload
        )
        echo "IPA_PATH=$IPA_DIR/Legado-unsigned.ipa" >> "$GITHUB_ENV"

    - name: Upload Xcode Result Bundle
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Legado-xcresult
        path: ${{ env.RESULT_BUNDLE }}
        if-no-files-found: ignore
    
    - name: Upload Build Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Legado-iOS-App
        path: ${{ env.DERIVED_DATA }}/Build/Products/Release-iphoneos/Legado.app

    - name: Upload IPA Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Legado-iOS-IPA
        path: ${{ env.IPA_PATH }}

  release:
    name: Create Release
    needs: build-and-test
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download IPA Artifact
      uses: actions/download-artifact@v4
      with:
        name: Legado-iOS-IPA
        path: release/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/Legado-unsigned.ipa
        generate_release_notes: true
        draft: false
