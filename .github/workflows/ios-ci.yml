name: iOS CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
    # 纯文档/工具脚本改动不触发构建：省 macOS 额度，也避免"排队抢占失败"刷出一堆无产物运行
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免多个运行互相抢 macOS runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30
    # 构建失败的 error 行会以 annotation 形式贴在运行页面，无需登录即可看到
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "15.4"
    
    - name: Cache SPM Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Prepare Build Paths
      run: |
        echo "DERIVED_DATA=$RUNNER_TEMP/LegadoDerivedData" >> "$GITHUB_ENV"
        echo "RESULT_BUNDLE=$RUNNER_TEMP/LegadoResults.xcresult" >> "$GITHUB_ENV"
    
    - name: Resolve SPM Dependencies
      run: >
        xcodebuild -resolvePackageDependencies
        -project Legado.xcodeproj
        -scheme Legado
    
    - name: Build
      run: |
        set -o pipefail
        xcodebuild build \
          -project Legado.xcodeproj \
          -scheme Legado \
          -sdk iphoneos \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath "$DERIVED_DATA" \
          -resultBundlePath "$RESULT_BUNDLE" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          IPHONEOS_DEPLOYMENT_TARGET=16.0 2>&1 | tee build.log

    # 把编译错误作为 annotation 打出来：不登录 GitHub 也能在运行页面直接看到
    - name: Show compile errors
      if: failure()
      continue-on-error: true
      run: |
        if [ -f build.log ]; then
          grep -E "error:" build.log | head -n 12 | sed 's/^/::error::/' || true
          echo "----- full error list -----" || true
          grep -E "error:" build.log | head -n 80 || true
        fi

    - name: Check Unit Test Target
      id: test_target
      run: |
        if grep -q "com.apple.product-type.bundle.unit-test" Legado.xcodeproj/project.pbxproj; then
          echo "has_tests=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_tests=false" >> "$GITHUB_OUTPUT"
        fi
    
    - name: Run Unit Tests
      if: ${{ success() && steps.test_target.outputs.has_tests == 'true' }}
      run: >
        xcodebuild test
        -project Legado.xcodeproj
        -scheme Legado
        -sdk iphonesimulator
        -configuration Debug
        -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5'
        -derivedDataPath "$DERIVED_DATA"
        -resultBundlePath "$RESULT_BUNDLE"
        ONLY_ACTIVE_ARCH=YES
        IPHONEOS_DEPLOYMENT_TARGET=16.0

    - name: Package Unsigned IPA
      if: success()
      run: |
        IPA_DIR="$RUNNER_TEMP/ipa"
        rm -rf "$IPA_DIR"
        mkdir -p "$IPA_DIR/Payload"
        cp -R "$DERIVED_DATA/Build/Products/Release-iphoneos/Legado.app" "$IPA_DIR/Payload/"
        (
          cd "$IPA_DIR"
          /usr/bin/zip -qry "Legado-unsigned.ipa" Payload
        )
        echo "IPA_PATH=$IPA_DIR/Legado-unsigned.ipa" >> "$GITHUB_ENV"

    - name: Job Summary
      if: success()
      run: |
        {
          echo "### 构建产物（本页底部 Artifacts 区域下载）"
          echo ""
          echo "| Artifact | 用途 |"
          echo "| --- | --- |"
          echo "| \`Legado-iOS-IPA\` | 未签名 IPA，用 ESign / Feather / Sideloadly 自签安装 |"
          echo "| \`Legado-iOS-App\` | 未签名 .app 目录 |"
          echo "| \`Legado-xcresult\` | Xcode 构建结果包（调试用） |"
          echo ""
          echo "IPA 大小：$(du -h "$IPA_PATH" | cut -f1)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Xcode Result Bundle
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Legado-xcresult
        path: ${{ env.RESULT_BUNDLE }}
        retention-days: 7
        if-no-files-found: ignore
    
    - name: Upload Build Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Legado-iOS-App
        path: ${{ env.DERIVED_DATA }}/Build/Products/Release-iphoneos/Legado.app
        retention-days: 14
        if-no-files-found: error

    - name: Upload IPA Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Legado-iOS-IPA
        path: ${{ env.IPA_PATH }}
        retention-days: 14
        if-no-files-found: error

  release:
    name: Create Release
    needs: build-and-test
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download IPA Artifact
      uses: actions/download-artifact@v4
      with:
        name: Legado-iOS-IPA
        path: release/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/Legado-unsigned.ipa
        generate_release_notes: true
        draft: false
